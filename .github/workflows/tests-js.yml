name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  js-wrapper-test:
    name: Tests (PHP ${{ matrix.php }}, Node ${{ matrix.node }}, Composer ${{ matrix.composer }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
        node: ["^22.12.0", "24", "26"]
        composer: [false, true]

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: "pnpm"

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      - name: Install Composer dependencies
        if: ${{ matrix.composer }}
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install dependencies
        run: pnpm install

      - name: Run tests
        run: pnpm php:tests

  coverage:
    name: Coverage Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: pcov

      # the apt lcov 2.0 prints bogus per-file rates in `lcov --list`, so overlay lcov 2.6 (without docs, which need sphinx, and without the optional XS extension)
      - name: Setup LCOV
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov
          git clone --depth 1 --branch v2.6 https://github.com/linux-test-project/lcov.git /tmp/lcov
          sudo make -C /tmp/lcov install LCOV_NO_DOC=1 LCOV_NO_XS=1
          hash -r
          lcov --version

      - name: Install dependencies
        run: pnpm install

      - name: Run coverage check (client with c8, server with pcov)
        run: pnpm coverage

      - name: Build the coverage table of every file
        id: coverage-table
        if: always()
        run: |
          {
            echo 'table<<EOF_COVERAGE_TABLE'
            echo '<details><summary>📚 Coverage of every file (client built files and server)</summary>'
            echo
            sh scripts/lcov-table.sh coverage/lcov.info coverage/php/lcov.info
            echo
            echo '</details>'
            echo
            echo 'EOF_COVERAGE_TABLE'
          } >> "$GITHUB_OUTPUT"

      - name: Report coverage
        if: always()
        uses: zgosalvez/github-actions-report-lcov@v7.2.0
        with:
          coverage-files: coverage/**/lcov.info
          artifact-name: code-coverage-report
          working-directory: .
          minimum-coverage: 0
          # c8 reports hit lines without branch data, which lcov 2.x flags as inconsistent once branch coverage is on
          genhtml-ignore-errors: inconsistent,corrupt,empty
          update-comment: true
          additional-message: ${{ steps.coverage-table.outputs.table }}
          # forks only get a read-only token, so only comment on same-repo PRs
          github-token: ${{ github.event.pull_request.head.repo.full_name == github.repository && secrets.GITHUB_TOKEN || '' }}
