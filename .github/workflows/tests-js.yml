name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  js-wrapper-test:
    name: Tests (PHP ${{ matrix.php }}, Node ${{ matrix.node }}, Composer ${{ matrix.composer }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
        node: ["^22.12.0", "24", "26"]
        composer: [false, true]

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: "pnpm"

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      - name: Install Composer dependencies
        if: ${{ matrix.composer }}
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install dependencies
        run: pnpm install

      - name: Run tests
        run: pnpm php:tests

  coverage:
    name: Coverage Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: pcov

      - name: Setup LCOV
        uses: hrishikesh-kadam/setup-lcov@v1

      - name: Install dependencies
        run: pnpm install

      - name: Run coverage check (client with c8, server with pcov)
        run: pnpm coverage

      - name: Report coverage
        if: always()
        uses: zgosalvez/github-actions-report-lcov@v7.2.0
        with:
          coverage-files: coverage/**/lcov.info
          artifact-name: code-coverage-report
          working-directory: .
          minimum-coverage: 0
          update-comment: true
          # forks only get a read-only token, so only comment on same-repo PRs
          github-token: ${{ github.event.pull_request.head.repo.full_name == github.repository && secrets.GITHUB_TOKEN || '' }}
