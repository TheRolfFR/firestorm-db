name: Static Analysis

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "tsconfig*.json"
      - ".github/workflows/static-analysis.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "tsconfig*.json"
      - ".github/workflows/static-analysis.yml"
  workflow_dispatch:

jobs:
  phpstan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Copy PHP config files into php folder
        run: |
          cp tests/php/*.php src/server/
          ls src/server/

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Download PHPStan (PHAR)
        run: |
          curl -L https://github.com/phpstan/phpstan/releases/latest/download/phpstan.phar -o phpstan.phar
          chmod +x phpstan.phar

      - name: Run PHPStan on php/
        run: |
          ./phpstan.phar analyse -c phpstan.neon

  typescript:
    name: TypeScript Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Run TypeScript compiler
        run: npx tsc --noEmit
